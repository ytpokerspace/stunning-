name: Browser game checks
on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/browser-check.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/browser-check.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate HTML assets and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          for name in ("index.html", "poker.html"):
              html = Path("web", name).read_text()
              scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
              assert scripts, f"No inline script in {name}"
              Path(f"/tmp/{name}.js").write_text("\n".join(scripts))
          for svg in Path("web/assets").glob("*.svg"):
              ET.parse(svg)
          assert 'id="attack"' in Path("web/index.html").read_text()
          assert 'id="deal"' in Path("web/poker.html").read_text()
          print("HTML controls and SVG assets validated")
          PY
          node --check web/poker.js
          node --check /tmp/index.html.js
          node --check /tmp/poker.html.js
          node --test web/*.test.js
