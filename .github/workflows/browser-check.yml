name: Browser game checks
on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/browser-check.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/browser-check.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate HTML assets and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          for name in ("index.html", "poker.html", "adventure.html"):
              path = Path("web", name)
              if path.exists():
                  html = path.read_text()
                  scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
                  if scripts:
                      Path(f"/tmp/{name}.js").write_text("\n".join(scripts))
          for svg in Path("web/assets").glob("*.svg"):
              ET.parse(svg)
          assert 'id="attack"' in Path("web/index.html").read_text()
          print("HTML assets and SVG files validated")
          PY
          node --check web/adventure.js
          node --check web/adventure-save.js
          node --check web/pixel-cartridge.js
          node --check /tmp/adventure.html.js
          node --test web/*.test.js
